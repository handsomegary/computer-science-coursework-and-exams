name: C++ solutions and independent tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/sync_solutions.py --check
      - run: python tools/check_document_companions.py
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: python tools/run_example.py --all-assignments --output-dir build/course-examples
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - test_pa2021_01_03.py
          - test_pa2021_04_05_final.py
          - test_pa2025.py
          - test_quizzes.py
          - test_exams.py
          - test_solution_book.py
          - test_reference_pa1.py
          - test_course_kmap.py
          - test_repaired_pa1_pa2.py
          - test_repaired_pa1_wallets.py
          - test_repaired_pa3.py
          - test_repaired_pa4.py
          - test_repaired_final.py
          - test_official_resources_2025.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: matrix.suite != 'test_repaired_final.py'
        run: python tests/${{ matrix.suite }}
      - if: matrix.suite == 'test_repaired_pa1_pa2.py'
        run: python tests/test_repaired_pa1_pa2.py --course-width --only-signed
      - if: matrix.suite == 'test_repaired_final.py'
        run: python tests/test_repaired_final.py --exhaustive
